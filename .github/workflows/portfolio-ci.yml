name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publication safety scan
        run: node scripts/check-public-safety.mjs
      - run: npm install --no-audit --no-fund
      - name: Unit tests (examples, Flow Run code, B2B simulator, Liquid structure)
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests (CSV merger and offline fictional FAQ retrieval)
        run: |
          python -m pip install -r projects/samsung-health-csv-merger/requirements.txt
          python -m unittest discover -s tests/python -v
      - run: npx tsc --noEmit
      - run: npm run build

