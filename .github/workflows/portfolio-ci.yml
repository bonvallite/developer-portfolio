name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publication safety scan
        run: node scripts/check-public-safety.mjs
      - run: npm install --no-audit --no-fund
      - name: Unit tests (examples, Flow Run code, B2B simulator, Liquid structure)
        run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
