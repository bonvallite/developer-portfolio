name: Portfolio checks
on:
  push:
    # The commerce showcase draft needs a direct push trigger because
    # Git Data API commits have not reliably raised PR synchronize events.
    # Keep this scope exact: no other feature branch or production deploy.
    branches: [main, feature/commerce-integration-lab-20261122]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SEO publication and privacy source checks
        run: node scripts/check-seo-publication.mjs
      - name: Publication safety scan
        run: node scripts/check-public-safety.mjs
      - run: npm install --no-audit --no-fund
      - name: Unit tests (examples, Flow Run code, B2B simulator, Liquid structure)
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests (CSV merger and offline fictional FAQ retrieval)
        run: |
          python -m pip install -r projects/samsung-health-csv-merger/requirements.txt
          python -m unittest discover -s tests/python -v
      - run: npx tsc --noEmit
      - run: npm run build
      # Verify the actual Next.js HTML and sitemap; source-only checks cannot
      # detect inherited titles on client-side case studies or rendering regressions.
      # Uses a locally built server and no visitor data, secrets or live requests.
      - name: Rendered flagship SEO metadata and sitemap
        run: |
          npm run start -- -p 3100 > /tmp/jrv-seo-next.log 2>&1 &
          node tests/seo-rendered-metadata.mjs


  case-study-browser-qa:
    # Run browser QA for reviewed case studies, cinematic projects, privacy
    # changes, content-audit fixes and interactive homepage/case-study PRs.
    # Unit/SEO/safety checks still run for all pull requests.
    # Run the same browser suite on ordinary PRs and the one approved
    # feature-branch push; Vercel deploys only a preview for this branch.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/feature/commerce-integration-lab-20261122') || (github.event_name == 'pull_request' && (github.head_ref == 'feature/google-analytics-api-portfolio-20261119' || github.head_ref == 'feature/analytics-visual-demo-20261120' || github.head_ref == 'redesign/2026-11-20-cinematic-portfolio' || github.head_ref == 'feature/ember-teal-interactive-portfolio' || startsWith(github.head_ref, 'feature/portfolio-enquiry-analytics-') || startsWith(github.head_ref, 'fix/portfolio-audit-content-') || startsWith(github.head_ref, 'feature/interactive-hero-project-studio-') || startsWith(github.head_ref, 'feature/spend-save-architecture-story-') || github.head_ref == 'feature/commerce-integration-lab-20261122'))
    needs: validate
    # Playwright 1.56 Chromium supports Ubuntu 24.04; latest runners may be 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Install temporary browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      # GitHub-hosted Ubuntu runners include Chrome; avoid large browser downloads.
      - name: Build local Next.js site
        run: npm run build
      - name: Launch local server
        run: |
          npm run start -- -p 3100 > /tmp/case-study-next.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3100/data-extraction-automation; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/case-study-next.log
          exit 1
      - name: Desktop tablet and mobile interaction checks
        run: node tests/case-study-browser-qa.mjs
      # The draft systems-lab branch also changes the homepage, so exercise
      # its responsive layout, original four modes, consent and both case links.
      - name: Cinematic homepage layout, privacy and conversion QA
        if: github.head_ref == 'redesign/2026-11-20-cinematic-portfolio' || github.head_ref == 'feature/ember-teal-interactive-portfolio' || startsWith(github.head_ref, 'feature/portfolio-enquiry-analytics-') || startsWith(github.head_ref, 'feature/interactive-hero-project-studio-') || github.head_ref == 'feature/commerce-integration-lab-20261122' || (github.event_name == 'push' && github.ref == 'refs/heads/feature/commerce-integration-lab-20261122')
        run: node tests/homepage-browser-qa.mjs
      # The Spend & Save case study connects shopper, merchant, post-checkout
      # Flow commit and notification states through a safe architecture map.
      - name: Spend and Save visual case-study and Flow browser QA
        if: startsWith(github.head_ref, 'feature/spend-save-architecture-story-')
        run: node tests/spend-save-visual-browser-qa.mjs
      # New serverless commerce engineering lab must remain completely local,
      # accessible, responsive, and independent of production integrations.
      - name: Commerce integration lab interactive browser QA
        if: github.head_ref == 'feature/commerce-integration-lab-20261122' || (github.event_name == 'push' && github.ref == 'refs/heads/feature/commerce-integration-lab-20261122')
        run: node tests/commerce-integration-browser-qa.mjs
      # Check consent rejection, acceptance and withdrawal on real browser links
      # using only fictional text and no external analytics/lead submissions.
      - name: Consent-first portfolio event privacy QA
        if: startsWith(github.head_ref, 'feature/portfolio-enquiry-analytics-')
        run: node tests/portfolio-events-browser-qa.mjs
      - name: Python analytics lab desktop tablet and mobile QA
        if: github.head_ref == 'feature/ember-teal-interactive-portfolio'
        run: node tests/analytics-lab-browser-qa.mjs
      - name: Save case-study screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-study-browser-qa
          path: |
            artifacts/case-study-browser-qa/
            artifacts/homepage-browser-qa/
            artifacts/analytics-lab-browser-qa/
            artifacts/spend-save-visual-browser-qa/
            artifacts/commerce-integration-lab/
          if-no-files-found: ignore
          retention-days: 7
