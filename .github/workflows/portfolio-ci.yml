name: Portfolio checks
on:
  push:
    # Production source and all feature pull requests are validated separately.
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SEO publication and privacy source checks
        run: node scripts/check-seo-publication.mjs
      - name: Publication safety scan
        run: node scripts/check-public-safety.mjs
      - run: npm install --no-audit --no-fund
      - name: Unit tests (examples, Flow Run code, B2B simulator, Liquid structure)
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests (CSV merger and offline fictional FAQ retrieval)
        run: |
          python -m pip install -r projects/samsung-health-csv-merger/requirements.txt
          python -m unittest discover -s tests/python -v
      - run: npx tsc --noEmit
      - run: npm run build
      # Verify the actual Next.js HTML and sitemap; source-only checks cannot
      # detect inherited titles on client-side case studies or rendering regressions.
      # Uses a locally built server and no visitor data, secrets or live requests.
      - name: Rendered flagship SEO metadata and sitemap
        run: |
          npm run start -- -p 3100 > /tmp/jrv-seo-next.log 2>&1 &
          node tests/seo-rendered-metadata.mjs


  case-study-browser-qa:
    if: github.event_name == 'pull_request'
    # Run every browser suite on every pull request, including the published
    # commerce integration lab. Avoid branch-name filters that skip regressions.
    # Source, safety, SEO, unit and build checks run on main pushes as well.
    needs: validate
    # Playwright 1.56 Chromium supports Ubuntu 24.04; latest runners may be 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Install temporary browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      # GitHub-hosted Ubuntu runners include Chrome; avoid large browser downloads.
      - name: Build local Next.js site
        run: npm run build
      - name: Launch local server
        run: |
          npm run start -- -p 3100 > /tmp/case-study-next.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3100/data-extraction-automation; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/case-study-next.log
          exit 1
      - name: Desktop tablet and mobile interaction checks
        run: node tests/case-study-browser-qa.mjs
      - name: Cinematic homepage layout, privacy and conversion QA
        run: node tests/homepage-browser-qa.mjs
      # GSAP v3 loads only on the homepage. Exercise real rendered headings,
      # no-reduced-motion animation cleanup and reduced-motion static fallback.
      - name: GSAP homepage reduced-motion browser QA
        run: node tests/gsap-hero-browser-qa.mjs
      # Explicit system-diagram playback: shipping replay, Shopify event flow,
      # CartonCloud signature-failure guard, and Spend & Save manual stages.
      - name: GSAP explanatory project diagram and reduced-motion browser QA
        run: node tests/gsap-diagrams-browser-qa.mjs
      - name: Closed-loop architecture tour and lifecycle browser QA
        run: node tests/logistics-tour-browser-qa.mjs
      - name: Executable Worker function inspector browser QA
        run: node tests/worker-function-browser-qa.mjs
      - name: Logistics metafield explorer browser QA
        run: node tests/logistics-metafield-browser-qa.mjs
      - name: Logistics security lab browser QA
        run: node tests/logistics-security-browser-qa.mjs
      - name: Logistics API workbench browser QA
        run: node tests/logistics-api-browser-qa.mjs
      - name: Physical cold-chain freight journey browser QA
        run: node tests/logistics-freight-browser-qa.mjs
      - name: Liquid notification studio browser QA
        run: node tests/logistics-notification-browser-qa.mjs
      - name: Logistics incident recovery browser QA
        run: node tests/logistics-recovery-browser-qa.mjs
      - name: Whole logistics studio chapter navigation and network boundary QA
        run: node tests/logistics-whole-page-browser-qa.mjs
      # Distinct hiring/merchant choices, fixed mailto prompts, privacy gating,
      # contextual experience hand-off and mobile contact-layout checks.
      - name: Hiring and merchant enquiry journey browser QA
        run: node tests/hiring-enquiry-browser-qa.mjs
      # Consent-safe first visit with no mobile overlay; keyboard Escape,
      # focus restoration, 320px contact access, and tablet/desktop parity.
      - name: Mobile privacy and contact accessibility browser QA
        run: node tests/mobile-privacy-accessibility-browser-qa.mjs
      # The Spend & Save case study connects shopper, merchant, post-checkout
      # Flow commit and notification states through a safe architecture map.
      - name: Spend and Save visual case-study and Flow browser QA
        run: node tests/spend-save-visual-browser-qa.mjs
      # CartonCloud simulated event/safe-recovery and static enquiry QA.
      - name: CartonCloud interactive event and incident browser QA
        run: node tests/cartoncloud-event-studio-browser-qa.mjs
      # Fictional B2B catalogue/pricing entitlement and responsive selector QA.
      - name: Shopify B2B pricing and entitlement visual browser QA
        run: node tests/b2b-entitlement-story-browser-qa.mjs
      # Published custom Shopify app / last-mile lab: purely fictional browser
      # calculations and API write-back simulation, with no provider calls.
      - name: Commerce integration lab desktop tablet and mobile QA
        run: node tests/commerce-integration-browser-qa.mjs
      # Check consent rejection, acceptance and withdrawal on real browser links
      # using only fictional text and no external analytics/lead submissions.
      - name: Consent-first portfolio event privacy QA
        run: node tests/portfolio-events-browser-qa.mjs
      - name: Python analytics lab desktop tablet and mobile QA
        run: node tests/analytics-lab-browser-qa.mjs
      # Sample local Next.js navigations for each flagship project at 1366px
      # and 390px. This informational lab report is not a Lighthouse audit
      # or real-user Core Web Vitals and never activates optional tracking.
      - name: Local browser navigation metrics (synthetic, informational)
        run: node tests/performance-lab-browser-qa.mjs
      # Cross-route brand consistency with accessible light surfaces in
      # editorial/printable demos. Browser tests never opt in to analytics.
      - name: Unified JRV colour system desktop and mobile browser QA
        run: node tests/portfolio-palette-browser-qa.mjs
      - name: Save case-study screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-study-browser-qa
          path: |
            artifacts/case-study-browser-qa/
            artifacts/homepage-browser-qa/
            artifacts/gsap-hero-qa/
            artifacts/gsap-diagram-qa/
            artifacts/logistics-tour-qa/
            artifacts/worker-function-qa/
            artifacts/logistics-metafield-qa/
            artifacts/logistics-security-qa/
            artifacts/logistics-api-qa/
            artifacts/logistics-freight-qa/
            artifacts/logistics-notification-qa/
            artifacts/logistics-recovery-qa/
            artifacts/logistics-whole-page-qa/
            artifacts/hiring-enquiry-browser-qa/
            artifacts/privacy-accessibility-qa/
            artifacts/analytics-lab-browser-qa/
            artifacts/spend-save-visual-browser-qa/
            artifacts/cartoncloud-event-studio-qa/
            artifacts/b2b-entitlement-story-qa/
            artifacts/performance-lab/
            artifacts/portfolio-palette-qa/
            artifacts/commerce-integration-lab/
          if-no-files-found: ignore
          retention-days: 7
