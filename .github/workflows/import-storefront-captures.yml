# Temporary draft-only importer of previously captured public site screenshots.
# Must be removed after reviewed assets are committed. No production push.
name: Import reviewed storefront homepage screenshots
on:
  push:
    branches:
      - integration/2026-11-22-cinematic-release
    paths:
      - .github/workflows/import-storefront-captures.yml
permissions:
  contents: write
  actions: read
jobs:
  import:
    if: github.ref == 'refs/heads/integration/2026-11-22-cinematic-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true # Required only for this bounded asset push.
      - name: Download vetted historical capture run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p /tmp/jrv-storefront-source
          gh run download 44490966868 --repo "$GITHUB_REPOSITORY" --name storefront-captures-44490966868 --dir /tmp/jrv-storefront-source
          test -s /tmp/jrv-storefront-source/manifest.json
      - name: Install pinned optimiser and verify snapshot provenance
        run: |
          set -eu
          python3 -m venv /tmp/jrv-storefront-python
          /tmp/jrv-storefront-python/bin/pip install --disable-pip-version-check Pillow==11.3.0
          /tmp/jrv-storefront-python/bin/python scripts/optimise-storefront-captures.py /tmp/jrv-storefront-source public/portfolio/storefronts
          test "$(find public/portfolio/storefronts -maxdepth 1 -name '*.webp' | wc -l)" -eq 21
          test ! -e public/portfolio/storefronts/axlrodd-desktop.webp
      - name: Commit only optimised public site assets to draft
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/portfolio/storefronts
          if git diff --cached --quiet; then echo "No image changes"; exit 0; fi
          if git diff --cached --name-only | grep -v '^public/portfolio/storefronts/'; then
            echo "Refusing to stage unrelated paths"
            exit 1
          fi
          git commit -m "assets(portfolio): add verified dated storefront WebP previews"
          git push origin HEAD:refs/heads/integration/2026-11-22-cinematic-release
