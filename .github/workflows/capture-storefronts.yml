# Manual evidence capture only. Never commit screenshots or deploy site changes.
name: Capture storefront homepage previews
on:
  workflow_dispatch:
    inputs:
      store:
        description: Store slug or all
        required: true
        default: all
        type: choice
        options:
          - all
          - peter-augustus
          - poseidon-animal-health
          - eve-curls
          - jace-industries
          - colossal-diamond-tools
          - rene-ruiz-collection
          - urban-august
          - warehouse-lighting
          - skull-seeker
          - osoyoo
          - axlrodd
          - tronus-footwear
permissions:
  contents: read
jobs:
  capture:
    # Pinned: Playwright 1.56.1 cannot install Chromium on Ubuntu 26.04.
    # Do not use ubuntu-latest until the browser/runtime combination is verified.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Playwright without changing repository lockfiles
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture desktop and mobile homepages
        id: capture
        continue-on-error: true
        env:
          CAPTURE_STORE: ${{ inputs.store }}
        run: node scripts/capture-storefronts.mjs
      - name: Upload captures and failure manifest for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storefront-captures-${{ github.run_id }}
          path: capture-output/
          if-no-files-found: warn
          retention-days: 7
      - name: Report unsuccessful captures
        if: steps.capture.outcome == 'failure'
        run: |
          echo "One or more captures failed. Check the downloaded manifest and screenshots."
          exit 1
