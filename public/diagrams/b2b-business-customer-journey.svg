<text x="800" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#f7e7c9">Shopify Advanced B2B</text>
<path d="M800 136v40" stroke="#d5a75d" stroke-width="4"/>
<rect x="418" y="174" width="764" height="91" rx="45" fill="url(#gold)"/>
<text x="800" y="233" text-anchor="middle" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#211b17">Business customer journey</text>
