<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title description">
<title id="title">Shopify B2B business customer journey</title>
<desc id="description">Six steps: Shopify Form submitted, team reviews application, company approved and assigned its market and catalogue, a Shopify notification welcome email sent, email-code sign-in, and automatic B2B catalogue pricing. Native Shopify customer accounts with no separate wholesale portal.</desc>
