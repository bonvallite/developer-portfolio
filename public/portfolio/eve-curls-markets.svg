<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">One Shopify ecosystem serving six European markets</title>
<desc id="desc">Conceptual diagram linking a central Shopify store to the United Kingdom, Switzerland, Netherlands, Italy, France and Spain, each with localised currency, language, content and catalogue.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#161f27"/><stop offset="1" stop-color="#0b1016"/></linearGradient><linearGradient id="gold" x1="0" x2="1"><stop stop-color="#e6c38b"/><stop offset="1" stop-color="#a77c46"/></linearGradient></defs>
<rect width="1200" height="630" rx="22" fill="url(#bg)"/>
<circle cx="1110" cy="24" r="285" fill="#c7995b" fill-opacity=".06"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="48" y="52" fill="#e0be89" font-size="17" letter-spacing="3">ILLUSTRATIVE INTERNATIONAL COMMERCE ARCHITECTURE</text>
<rect x="379" y="84" width="442" height="112" rx="18" fill="#2c3236" stroke="#d1a970" stroke-width="2"/>
<text x="600" y="124" text-anchor="middle" fill="#f1e8d8" font-size="27" font-weight="700">ONE SHOPIFY ACCOUNT</text>
<text x="600" y="159" text-anchor="middle" fill="#d3ba96" font-size="17">Shared operations • market-aware storefront</text>
