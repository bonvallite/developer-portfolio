<text x="49" y="580" fill="#e7c18d" font-size="18" font-weight="700">CURRENCY   •   CATALOGS   •   DISCOUNTS   •   THEME   •   CHECKOUT / ACCOUNTS   •   DOMAIN / LANGUAGE</text><text x="49" y="606" fill="#98a6b1" font-size="15">Conceptual architecture only. Not a screenshot or export of Eve Curls' live Shopify configuration.</text>
